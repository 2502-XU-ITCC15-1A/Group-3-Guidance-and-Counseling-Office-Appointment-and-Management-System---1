<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XU GCO Appointment Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <div class="logo-wrap" aria-label="School logo area">
          <img id="schoolLogo" class="logo-img" src="assets/xulogo.png" alt="Xavier University logo" />
          <div id="logoFallback" class="logo" aria-hidden="true">XU</div>
        </div>
        <div class="brand-copy">
          <p class="brand-title">Xavier University - Ateneo de Cagayan</p>
          <p class="brand-subtitle">Guidance and Counseling Office</p>
        </div>
      </div>
      <button id="logoutBtn" class="btn ghost hidden">Logout</button>
    </header>

    <main id="appRoot"></main>
  </div>

  <template id="roleSelectTpl">
  <section class="role-layout">

    <!-- LEFT SIDE -->
    <div class="role-left">
      <div class="welcome-box">
        <h1>Hello, User!</h1>
        <p>
          Enter your personal details<br>
          and start your journey with us!
        </p>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="role-right">
      <div class="role-logo-wrap">
        <img src="XULOGO.png" alt="XU Logo">
        <div>
          <h2>Xavier University</h2>
          <span>Ateneo de Cagayan</span>
        </div>
      </div>

      <h3>Select Access Role</h3>
      <p class="muted">Choose how you want to continue</p>

      <div class="role-stack">
        <button class="role-btn" data-role="student">Student</button>
        <button class="role-btn" data-role="counselor">Counselor</button>
        <button class="role-btn" data-role="admin">Admin</button>
      </div>

      <p class="tiny muted domain-text">
        Supported: @my.xu.edu.ph and @xu.edu.ph
      </p>
    </div>

  </section>
</template>
 <template id="loginTpl">
  <section class="login-layout">

    <!-- LEFT PANEL -->
    <div class="login-left">
      <div class="welcome-box">
        <h1>Hello, User!</h1>
        <p>
          Enter your personal details<br>
          and start your journey with us!
        </p>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="login-right">

      <div class="login-logo">
        <img src="XULOGO.png" alt="XU Logo">
        <div>
          <h2>Xavier University</h2>
          <span>Ateneo de Cagayan</span>
        </div>
      </div>

      <form id="loginForm" class="login-form">

        <input type="email" id="email" placeholder="Username" required>

            <div class="password-wrap">
              <input type="password" id="password" placeholder="Password" required>
              <span class="toggle-password" onclick="togglePassword('password', this)">👁</span>
            </div>
            
          <div class="selected-role" id="loginRoleLabel"></div>

          <div class="login-options">
            <label>
              <input type="checkbox" id="rememberMe">
              Remember me
            </label>

            <a href="#">Forgot password?</a>
          </div>

          <div class="login-actions">
            <button type="submit" class="login-btn">
              Log in
            </button>
            <button type="button" id="backBtn" class="btn-secondary">
              Back
            </button>
          </div>

          <button type="button" id="gotoSignupBtn" class="signup-link">
            Click here to sign up
          </button>
        <button type="button" id="gotoVerifyBtn" class="hidden"></button>

      </form>

      <p id="loginMessage" class="feedback"></p>

    </div>
  </section>
</template>

  <template id="signupTpl">
    <section class="card center-card">
      <h2>Create Account</h2>
      <p class="muted">Register with your university email and verify it via email link.</p>
      <form id="signupForm" class="stack-md">
        <label class="field">
          <span>Full Name</span>
          <input type="text" id="signupFullName" required />
        </label>
        <label class="field">
          <span>Role</span>
          <select id="signupRole">
            <option value="student">Student (@my.xu.edu.ph)</option>
            <option value="counselor">Counselor (@xu.edu.ph)</option>
            <option value="admin">Admin (@xu.edu.ph)</option>
          </select>
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="signupEmail" required />
        </label>
        <label class="field">
          <span>Password</span>
          <div class="password-wrap">
            <input type="password" id="signupPassword" minlength="8" placeholder="Password" required />
            <span class="toggle-password" onclick="togglePassword('signupPassword', this)">👁</span>
          </div>
        <button type="submit" class="btn primary">Sign up</button>
<button type="button" id="signupBackBtn" class="btn ghost">Back to Login</button>      </form>
      <p id="signupMessage" class="feedback" aria-live="polite"></p>
    </section>
  </template>

  <template id="verifyTpl">
    <section class="card center-card">
      <h2>Verify Account</h2>
      <p class="muted">Paste your verification token from email, or use the email link directly.</p>
      <form id="verifyForm" class="stack-md">
        <label class="field">
          <span>Verification Token</span>
          <input type="text" id="verifyTokenInput" required />
        </label>
        <button type="submit" class="btn primary">Verify</button>
        <button type="button" id="verifyBackBtn" class="btn ghost">Back</button>
      </form>
      <p id="verifyMessage" class="feedback" aria-live="polite"></p>
    </section>
  </template>

<template id="dashboardTpl">
  <section class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="student-profile">
        <img src="xulogo.png" alt="Profile" class="profile-pic">

        <div class="student-info">
          <h4>Kristine Jean Baygan</h4>
          <p>Student</p>
        </div>
      </div>

      <h3 id="roleDashboardLabel"></h3>
      <nav id="menuNav" class="menu"></nav>

    </aside>

    <!-- MAIN CONTENT -->
    <section class="panel">
      <div id="viewRoot"></div>
    </section>

  </section>
</template>

  <script src="script.js"></script>
</body>
</html>
